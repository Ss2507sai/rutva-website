<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutva by Haarekhaa Raju | Not Just Fashion, A Feeling</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--brown:#5c4033;--cream:#f5f3ef}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cormorant Garamond',serif}
nav{position:fixed;top:0;width:100%;background:#fff;padding:18px 6%;display:flex;justify-content:space-between}
.logo{font-size:28px;letter-spacing:4px;color:var(--brown)}
.menu{display:flex;gap:30px}
.hero{margin-top:90px;min-height:90vh;display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.hero-content{position:relative;text-align:center}
.hero h1{font-size:64px}
section{padding:100px 6%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px}
.card img{width:100%;height:420px;object-fit:cover}
footer{background:#111;color:#ccc;padding:60px 6%;text-align:center}
</style>
</head>
<body>

<nav>
  <div class="logo">RUTVA</div>
  <div class="menu">
    <a href="#">Men</a>
    <a href="#">Women</a>
    <a href="#">Collections</a>
  </div>
</nav>

<section class="hero">
  <img src="https://i.ibb.co/CZg6qPt/Screenshot-2025-12-27-at-10-50-21-PM.png">
  <div class="hero-content">
    <h1>NOT JUST FASHION,<br>A FEELING</h1>
  </div>
</section>

<section>
  <div class="grid">
    <div class="card"><img src="https://i.ibb.co/MyqgvFpK/Screenshot-2025-12-27-at-10-49-44-PM.png"></div>
    <div class="card"><img src="https://i.ibb.co/TqHTcXBq/Screenshot-2025-12-27-at-10-49-19-PM.png"></div>
    <div class="card"><img src="https://i.ibb.co/FkfgqPyK/Screenshot-2025-12-27-at-10-49-06-PM.png"></div>
  </div>
</section>

<footer>© 2025 Rutva by Haarekhaa Raju</footer>
</body>
</html>
